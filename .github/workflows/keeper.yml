name: brightness-keeper
on:
  schedule:
    - cron: "17 * * * *"   # every hour
  workflow_dispatch:
permissions:
  contents: write
concurrency: keeper
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: node keeper.mjs
        env:
          KEEPER_KEY: ${{ secrets.KEEPER_KEY }}
      - name: save state
        run: |
          git config user.name keeper-bot
          git config user.email keeper-bot@users.noreply.github.com
          git add state.json
          git diff --cached --quiet || (git commit -m "keeper state" && git push)
